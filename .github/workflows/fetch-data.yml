name: Echte Daten holen (OSM + Fahrplan)

# Holt Wege, Huetten und Seilbahnen aus OpenStreetMap, Fahrplaene und den
# Lawinenlagebericht. Laeuft auf GitHub, weil nur dort freies Internet ist, und
# schreibt die Ergebnisse auf den Zweig "daten" (static/ und data/). Danach
# wird die Pages-Fassung neu gebaut; die baut den Datenstand von "daten" ein.
on:
  # Der Lagebericht erscheint um 17 Uhr, Aktualisierungen um 8 Uhr (Wiener
  # Zeit). GitHub startet geplante Laeufe oft Stunden spaeter, besonders zur
  # vollen und halben Stunde - darum krumme Minuten und ein dritter Lauf am
  # Abend als Rueckfall. 07:23/16:23/20:23 UTC = 08:23/17:23/21:23 Winterzeit.
  # Zeitplaene laufen immer auf dem Standardzweig (main).
  schedule:
    - cron: '23 7,16,20 * * *'
  push:
    branches: [claude/innsbruck-webapp-proposal-qnyvew]
    paths:
      - scripts/fetch/**
      - .github/workflows/fetch-data.yml
  workflow_dispatch:
    inputs:
      force_osm:
        description: 'OSM-Daten auch dann neu holen, wenn sie juenger als eine Woche sind'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Die Abholer lesen den bisherigen Stand (etwa den letzten Lagebericht),
      # also zuerst den aktuellen Datenzweig einbauen.
      - name: Bisherigen Datenstand holen
        run: |
          git fetch -q origin daten
          git checkout FETCH_HEAD -- data static

      - name: OpenStreetMap (Wege, Huetten, Seilbahnen, Gipfel, Haltestellen)
        continue-on-error: true
        timeout-minutes: 20
        env:
          FORCE_OSM: ${{ inputs.force_osm && '1' || '0' }}
        run: python scripts/fetch/osm.py

      - name: Fahrplaene (GTFS) suchen und Verbindungen ausrechnen
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch/gtfs.py

      - name: Verbindungen bei Transitous abfragen
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/fetch/transitous.py

      - name: Lawinenlagebericht Tirol (avalanche.report)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch/avalanche.py

      - name: Messstationen Lawinenwarndienst Tirol
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/fetch/stations.py

      - name: Bergwetter (GeoSphere AROME)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch/weather.py

      - name: Fotos von Wikimedia (Taeler, Gipfel)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch/photos.py

      - name: Freie Schnittstellen pruefen
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch/probe_apis.py

      # Nur von Hand und beim Pushen auf den Arbeitszweig - nicht dreimal taeglich
      - name: Weitere Schnittstellen im Detail pruefen
        if: github.event_name != 'schedule'
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch/probe_deep.py

      # Die Ergebnisse gehen auf den Zweig "daten", NICHT auf main. Sonst kaeme
      # main dreimal taeglich ein Commit dazu, und jeder Pull Request wuerde
      # gegen einen sich staendig bewegenden Stand laufen ("out of date").
      - name: Ergebnisse auf den Datenzweig schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nur die Datenpfade einpacken; fehlt einer, soll das die anderen nicht verschlucken.
          PFADE=""
          for pfad in static/osm static/stationen static/photos data/gtfs data/transit data/probe data/lawine data/wetter; do
            if [ -e "$pfad" ]; then PFADE="$PFADE $pfad"; fi
          done
          tar -cf "$RUNNER_TEMP/daten.tar" $PFADE
          git fetch -q origin daten
          git checkout -q -f -B daten FETCH_HEAD
          tar -xf "$RUNNER_TEMP/daten.tar"
          git add $PFADE
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -q -m "Daten aktualisiert: Lawine, Fahrplan, OSM ($(date -u "+%Y-%m-%d %H:%M") UTC)"
            # Im Zweig kann sich waehrend des Laufs etwas bewegt haben. Bei
            # Konflikten gewinnt der eben geholte, frischere Stand.
            for versuch in 1 2 3; do
              if git push -q origin HEAD:daten; then break; fi
              git fetch -q origin daten
              git rebase -q -X theirs FETCH_HEAD || git rebase --abort
            done
          fi

  # Neu bauen, auch wenn der Commit-Schritt scheitert: dann mit dem letzten
  # guten Datenstand. Auf dem Arbeitszweig wird nichts veroeffentlicht.
  pages:
    needs: fetch
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
