name: Echte Daten holen (OSM + Fahrplan)

# Holt Wege, Huetten und Seilbahnen aus OpenStreetMap und sucht oeffentliche
# GTFS-Fahrplaene. Laeuft auf GitHub, weil nur dort freies Internet ist, und
# committet die Ergebnisse nach static/osm/ und data/gtfs/ zurueck.
on:
  push:
    branches: [claude/innsbruck-webapp-proposal-qnyvew]
    paths:
      - scripts/fetch/**
      - .github/workflows/fetch-data.yml
  workflow_dispatch:
    inputs:
      force_osm:
        description: 'OSM-Daten auch dann neu holen, wenn sie juenger als eine Woche sind'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: OpenStreetMap (Wege, Huetten, Seilbahnen, Gipfel, Haltestellen)
        continue-on-error: true
        timeout-minutes: 20
        env:
          FORCE_OSM: ${{ inputs.force_osm && '1' || '0' }}
        run: python scripts/fetch/osm.py

      - name: Fahrplaene (GTFS) suchen und Verbindungen ausrechnen
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch/gtfs.py

      - name: Verbindungen bei Transitous abfragen
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/fetch/transitous.py

      - name: Freie Schnittstellen pruefen
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch/probe_apis.py

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/osm data/gtfs data/transit data/probe 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert: OSM und Fahrplan ($(date -u +%Y-%m-%d))"
            git push
          fi
