name: Echte Daten holen (OSM + Fahrplan)

# Holt Wege, Huetten und Seilbahnen aus OpenStreetMap, Fahrplaene und den
# Lawinenlagebericht. Laeuft auf GitHub, weil nur dort freies Internet ist, und
# committet die Ergebnisse nach static/osm/ und data/ zurueck.
on:
  # Der Lagebericht erscheint gegen 17 Uhr, manchmal mit Aktualisierung am
  # Morgen: 06:30 und 16:30 UTC = 07:30 und 17:30 Wiener Winterzeit.
  # Zeitplaene laufen immer auf dem Standardzweig (main).
  schedule:
    - cron: '30 6,16 * * *'
  push:
    branches: [claude/innsbruck-webapp-proposal-qnyvew]
    paths:
      - scripts/fetch/**
      - .github/workflows/fetch-data.yml
  workflow_dispatch:
    inputs:
      force_osm:
        description: 'OSM-Daten auch dann neu holen, wenn sie juenger als eine Woche sind'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: OpenStreetMap (Wege, Huetten, Seilbahnen, Gipfel, Haltestellen)
        continue-on-error: true
        timeout-minutes: 20
        env:
          FORCE_OSM: ${{ inputs.force_osm && '1' || '0' }}
        run: python scripts/fetch/osm.py

      - name: Fahrplaene (GTFS) suchen und Verbindungen ausrechnen
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch/gtfs.py

      - name: Verbindungen bei Transitous abfragen
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/fetch/transitous.py

      - name: Lawinenlagebericht Tirol (avalanche.report)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch/avalanche.py

      - name: Fotos von Wikimedia (Taeler, Gipfel)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch/photos.py

      - name: Freie Schnittstellen pruefen
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/fetch/probe_apis.py

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jeden Pfad einzeln: fehlt einer, soll das nicht die anderen verschlucken.
          for pfad in static/osm static/photos data/gtfs data/transit data/probe data/lawine; do
            if [ -e "$pfad" ]; then git add "$pfad"; fi
          done
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert: Lawine, Fahrplan, OSM ($(date -u "+%Y-%m-%d %H:%M") UTC)"
            # Der Zweig kann sich waehrend des Laufs bewegt haben.
            git pull --rebase
            git push
          fi
