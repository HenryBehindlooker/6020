name: Demo-Fassung auf GitHub Pages

# Baut die vorgerenderte Fassung und veroeffentlicht sie. Lawinenbericht und
# Busverbindungen kommen aus den Abzuegen des Abholers (echt, sofern gueltig);
# das Wetter ist noch Beispieldaten.
on:
  push:
    branches: [main]
  # Der Abholer committet neue Daten mit dem Workflow-Token - solche Pushes
  # loesen bewusst keine anderen Workflows aus. Darum hier ausdruecklich auf
  # sein Ende warten, damit der frische Lagebericht auch veroeffentlicht wird.
  workflow_run:
    workflows: ['Echte Daten holen (OSM + Fahrplan)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Nach dem Abholer nur bauen, wenn er erfolgreich war
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Beim Ausloesen durch den Abholer den neuesten Stand von main nehmen,
          # nicht den Commit, auf dem der Abholer gestartet ist.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          # Projektseiten liegen unter /<repo>
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
