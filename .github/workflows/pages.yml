name: Demo-Fassung auf GitHub Pages

# Baut die vorgerenderte Fassung und veroeffentlicht sie. Lawinenbericht,
# Busverbindungen und Wetter kommen aus den Abzuegen des Abholers.
#
# Der Abholer ruft diesen Workflow nach jedem Lauf direkt auf (workflow_call).
# Frueher sollte das ueber workflow_run passieren - das hat nach den geplanten
# Laeufen nie ausgeloest, und die Seite stand vom 29.9. bis 2.11.2026 still.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Auf Jobebene, damit die Sperre auch beim Aufruf aus dem Abholer gilt
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Beim Aufruf aus dem Abholer den eben gepushten Datenstand nehmen,
          # nicht den Commit, auf dem der Abholer gestartet ist.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Projektseiten liegen unter /<repo>. Aus GITHUB_REPOSITORY, weil
      # github.event bei geplanten Laeufen keine Repository-Angaben hat.
      - run: BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
